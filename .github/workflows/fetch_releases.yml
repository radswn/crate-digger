name: Fetch New Releases

on:
  schedule:
    - cron: '15 2 * * 6'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: fetch-releases
  cancel-in-progress: false

jobs:
  fetch-releases:
    name: Fetch New Releases
    runs-on: ubuntu-latest
    environment: gh-actions
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE }}
          aws-region: eu-west-1

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.0'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --frozen

      - name: Install project (editable)
        run: uv pip install -e .

      - name: Download cached tokens from S3
        run: aws s3 cp s3://radswn-spotify-auth-cache/.spotipy_cache .spotipy_cache --recursive

      - name: Download followed-label state from S3
        run: |
          aws s3 cp s3://radswn-spotify-auth-cache/.crate_digger_state/fetch_pipeline .crate_digger_state/fetch_pipeline --recursive || true
          aws s3 cp s3://radswn-spotify-auth-cache/.crate_digger_state/followed_labels.json .crate_digger_state/followed_labels.json || true
          aws s3 cp s3://radswn-spotify-auth-cache/.crate_digger_state/backfilled_labels.json .crate_digger_state/backfilled_labels.json || true

      - name: Run script for fetching new releases
        env:
          SPOTIPY_CLIENT_ID: ${{ secrets.SPOTIPY_CLIENT_ID }}
          SPOTIPY_CLIENT_SECRET: ${{ secrets.SPOTIPY_CLIENT_SECRET }}
          SPOTIPY_REDIRECT_URI: ${{ secrets.SPOTIPY_REDIRECT_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python -m crate_digger.main.fetch_new_releases

      - name: Upload refreshed tokens back to S3
        if: always()
        run: aws s3 cp .spotipy_cache s3://radswn-spotify-auth-cache/.spotipy_cache --recursive

      - name: Upload followed-label state back to S3
        if: always()
        run: if [ -d .crate_digger_state/fetch_pipeline ]; then aws s3 cp .crate_digger_state/fetch_pipeline s3://radswn-spotify-auth-cache/.crate_digger_state/fetch_pipeline --recursive; fi
