name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.0'

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.0.0

      - name: Install dependencies
        run: make install UV_SYNC_FLAGS="--frozen --group dev --group dashboard"

      - name: Lint (ruff)
        run: make lint

      - name: Type check (ty)
        run: make typecheck

      - name: Tests
        run: make test PYTEST_ARGS="--ignore=tests/test_auth.py"
