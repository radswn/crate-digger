<div class="song-grid" style="--rows-desktop:{{ (items | length + 2) // 3 }};--rows-tablet:{{ (items | length + 1) // 2 }};--rows-mobile:{{ items | length }}">
  {% for item in items %}
    <div class="song{% if item.decision is not none %} reviewed{% endif %}" data-pending="{{ 'true' if item.decision is none else 'false' }}">
      <div class="song-name" title="{{ item.track.title }} — {{ item.track.artist_name }}">
        <span class="number">{{ '%02d' | format(item.position) }}</span>
        <span class="song-text"><strong>{{ item.track.title }}</strong><small>{{ item.track.artist_name }}</small></span>
      </div>
      <div class="choices" role="group" aria-label="Review {{ item.track.title }}">
        {% for choice, label in (('keep', 'Keep'), ('skip', 'Skip')) %}
          <label class="choice {{ choice }}"><input type="checkbox" name="decision_{{ item.item_id }}" value="{{ choice }}" {% if item.decision == choice or (item.decision == 'pass' and choice == 'skip') %}checked{% endif %} {% if item.decision is not none %}disabled{% endif %}><span>{{ label }}</span></label>
        {% endfor %}
        {% if item.decision in ('maybe', 'skip') %}<span class="legacy">Reviewed</span>{% endif %}
      </div>
    </div>
  {% endfor %}
</div>
