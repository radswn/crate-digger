[project]
name = "crate-digger"
version = "1.0.0"
description = ""
authors = [{ name = "Radosław Winiecki", email = "r.winiecki@outlook.com" }]
requires-python = ">=3.14"
readme = "README.md"
dependencies = [
    "spotipy (>=2.25.1,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "mutagen (>=1.47.0,<2.0.0)",
    "pandas>=2.3.3,<3",
    "requests>=2.32.5,<3",
]

[project.scripts]
crate-digger = "crate_digger.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crate_digger"]

[dependency-groups]
dashboard = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
]
dev = [
    "pytest>=8.4.1,<9",
    "jupyter>=1.1.1,<2",
    "ruff>=0.14.10",
    "pre-commit>=4.5.1",
    "ty>=0.0.8",
]

[tool.pytest.ini_options]
markers = [
    "spotify_live: tests that call the live Spotify API using the configured test playlist",
]
